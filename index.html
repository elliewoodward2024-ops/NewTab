
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewTab</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="allJS/main.js" defer></script>
</head>

<body>

    <div class="main-container">
        <div class="clock" id="liveClock"></div>
        <div class="date" id="live-date"></div>

        <form action="https://www.google.com/search"
              method="GET"
              target="_blank"
              class="TextCon">

            <input id="search"
                   type="text"
                   name="q"
                   class="searchBar"
                   placeholder="Search..."
                   required>
        </form>
    </div>



    <!-- <section id="focus-timer">
        <h2>Deep Space</h2>
        <label for="duration">Focus duration (minutes)</label>
        <input id="duration" type="number" min="1" max="180" value="25">

        <p id="timer-display">25:00</p>
        <button id="start-timer">Start</button>
        <button id="pause-timer">Pause</button>
        <button id="reset-timer">Reset</button>
    </section> -->


    <main>

        <div id="settings" class="window">

            <div class="settings-header">
                <h1>Settings</h1>

                <button type="button"
                        onclick="closeWindow(document.getElementById('settings'))"
                        aria-label="Close settings">
                    x
                </button>
            </div>

            <div class="window-content">
                <p style="font-size: 17px;">Choose a theme:</p>
              
            
                <button type="button" onclick="changeTheme('default')">Default</button>
                <button type="button" onclick="changeTheme('violet')">Violet</button>
                <button type="button" onclick="changeTheme('silver')">Moonlight</button>
                <button type="button" onclick="changeTheme('teal')">Emerald</button>
                <button type="button" onclick="changeTheme('brown')">Chocolate</button>
                <button type="button" onclick="changeTheme('red')">Maroon</button>
                
                
            </div>
        </div>

        <div id="notes" class="window">

            <div class="window-header">
                <h1>Notes App</h1>

                <button type="button"
                        onclick="closeWindow(document.getElementById('notes'))"
                        aria-label="Close notes">
                    x
                </button>
            </div>

            <div class="window-content">
                <input id="noteTitle" placeholder="Note title...">

                <textarea id="noteContent"
                          placeholder="Write your note..."></textarea>

                <button type="button" id="saveButton">Save Note</button>

                <h2 class="saved-notes-heading">Saved Notes</h2>
                <div id="notesList"></div>
            </div>
        </div>

    </main>

    <div id="desktopApps">

        <button class="desktop-icon"
                type="button"
                onclick="openWindow(document.getElementById('settings'))">
            <span class="desktop-symbol">⚙</span>
            <span>Settings</span>
        </button>

        <button class="desktop-icon2"
                type="button"
                onclick="openWindow(document.getElementById('notes'))">
            <span class="desktop-symbol notes-symbol">≔</span>
            <span>Quick Note</span>
        </button>

    </div>

    
<div class="moon-container">
    <svg class="moon" id="moon"
         viewBox="0 0 150 150"
         role="img"
         aria-label="Current Moon phase">
        <defs>
            <clipPath id="moon-clip">
                <circle cx="75" cy="75" r="74"/>
            </clipPath>
        </defs>
        <g clip-path="url(#moon-clip)">
            <path id="moon-shadow" fill-opacity="0.65" fill="var(--panel)" d=""/>
        </g>
    </svg>
    <div class="phase-name" id="phase-name"></div>
</div>




<section id="bookmarks">
    <div id="bookmarkList"></div>
    <button type="button" id="addBookmark" class="bookmark-circle add-bookmark" aria-label="Add a bookmark" > + </button>
</section>

<div id="bookmarkWindow" class="window">

            <div class="window-header">
                <h1>Add Bookmark</h1>

                <button type="button" id="closeBookmark">
                    x
                </button>
            </div>

            <div class="window-content">
                <label for="bookmarkName">Name</label>

                <input id="bookmarkName" type="text" placeholder="e.g. GitHub" maxlength="30">

        <label for="bookmarkURL">Website URL</label>
        <input id="bookmarkURL" type="url" placeholder="https://github.com" >

        <button type="button" id="saveBookmark">Save Bookmark</button> 
        <p id="bookmarkMessage" role="status"></p>       

            </div>
</div>


</body>
</html>
