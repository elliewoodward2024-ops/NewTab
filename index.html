<head>
    <meta charset="UTF-8">
    <title>NewTab</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="allJS/main.js" defer></script>
</head>





<body>
   
    <div class="main-container">
        <div class="clock" id="liveClock"></div>
        <div class="date" id="live-date"></div>
  
        <form action="https://google.com/search" method="GET" target="_blank" class="TextCon"> 
            <input id="search" type="text" name="q" class="searchBar" placeholder="Search..." required>
         </form>
    </div>

    <main>


        <div id="settings" class="window">

            <div id="settingsheaders" class="settings-header">
                <h1>Settings</h1>

                <button type="button" onclick="closeWindow(document.getElementById('settings'))" aria-label="Close setting window">
                    x
                </button>
            </div>

            <div class="window-content">
                <p>Here are a list of themes you can choose from:</p>
                <button onclick="changeTheme('default')">Default</button>
                <button onclick="changeTheme('violet')">Violet</button>
                <button onclick="changeTheme('silver')">Moonlight</button>
                <button onclick="changeTheme('teal')">Emerald</button>

                <br>
                
            </div>
        </div>


    </main>


    <div id="desktopApps" style="padding-top: 64px; padding-left: 16px; ">
            <button class="desktop-icon" onclick="openWindow(document.getElementById('settings'))">
                <p><span style="font-size: 20px;">⚙︎</span><br>Settings</p>
            </button>
    </div>

</body>
